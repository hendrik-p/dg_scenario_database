{% extends 'base.html' %}

{% block content %}

<div class="container mt-3">
  <h1>Scenario Clicks</h1>
  <form method="POST" action="{{ url_for('reset_scenario_clicks') }}" onsubmit="return confirm('Reset all scenario click counts to 0? This cannot be undone.');">
    <button type="submit" class="btn btn-secondary btn-sm mb-2">Reset all counts to 0</button>
  </form>
  <table id="scenario_clicks_table" class="table table-bordered table-striped table-hover" style="width:100%">
    <thead>
      <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Clicks</th>
      </tr>
    </thead>
    <tbody>
      {% for scenario in scenarios %}
      <tr>
        <td>{{ scenario.id }}</td>
        <td>{{ scenario.title }}</td>
        <td>{{ scenario.click_count }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>

<script>
  $(document).ready(function () {
    $('#scenario_clicks_table').DataTable({
      order: [[2, 'desc']],
      pageLength: 50,
    });
  });
</script>

{% endblock %}
